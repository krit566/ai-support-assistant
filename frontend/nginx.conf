server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    client_max_body_size 6m;   # a little above the API's 5 MB upload limit, so the API gives the clear error
  }

  # single-page app: every other path serves index.html and React Router picks the page
  location / {
    try_files $uri /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
